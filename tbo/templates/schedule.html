<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Spielplan – Gruppe {{ group.name }}</title>
    <style>
        body { font-family: "DejaVu Sans", Arial, sans-serif; margin: 2cm; }
        h1   { text-align: center; margin-bottom: 1cm; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            border: 1px solid #777;
            padding: 0.4em;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
        }
        /* Für den Druck: Seitenumbruch nach jeder Seite */
        @media print {
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
        }
    </style>
</head>
<body>

<h1>Spielplan – Gruppe {{ group.name }}</h1>

<table>
    <thead>
        <tr>
            <th>Match‑ID</th>
            <th>Feld</th>
            <th>Team 1</th>
            <th>Team 2</th>
            <th>Schiedsrichter</th>
        </tr>
    </thead>
    <tbody>
    {% for m in matches %}
        <tr>
            <td style="text-align:center;">{{ m.id }}</td>
            <td style="text-align:center;">{{ m.court }}</td>
            <td>{{ m.t1 }}</td>
            <td>{{ m.t2 }}</td>
            <td>{{ m.ref or '-' }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>

</body>
</html>
